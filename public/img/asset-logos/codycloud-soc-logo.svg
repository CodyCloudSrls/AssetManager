<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 44" role="img" aria-label="CodyCloud Asset">
  <defs>
    <linearGradient id="ccsoc-badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6f9bff"/>
      <stop offset="1" stop-color="#4b6bfb"/>
    </linearGradient>
  </defs>
  <!-- gradient badge -->
  <rect x="2" y="2" width="40" height="40" rx="11" fill="url(#ccsoc-badge)"/>
  <!-- white cube mark (asset) -->
  <g transform="translate(22,22)" stroke="#ffffff" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round" fill="none">
    <path d="M0,-11 L10,-5.5 L10,5.5 L0,11 L-10,5.5 L-10,-5.5 Z"/>
    <path d="M0,-11 L0,0 M0,0 L10,5.5 M0,0 L-10,5.5"/>
  </g>
  <!-- two-tone wordmark -->
  <text x="54" y="29" font-family="-apple-system,BlinkMacSystemFont,Inter,'Segoe UI',Roboto,sans-serif" font-size="20" font-weight="700" letter-spacing="-0.4"><tspan fill="#f5f7fb">CodyCloud</tspan><tspan fill="#6f9bff"> Asset</tspan></text>
</svg>
