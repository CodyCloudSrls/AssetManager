name: Bug Report
description: File a bug report.
title: "[Bug]: "
type: bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report.

        Before opening a new issue, please confirm you have checked:

        - `.env` and runtime configuration
        - migrations and storage permissions
        - logs for the failing request or background job

        Please remove sensitive information from screenshots, traces, and attachments.
  - type: input
    id: version
    attributes:
      label: Application Version
      description: What version or commit are you seeing this issue on?
      placeholder: ex. v1.0.0 or 1a2b3c4
    validations:
      required: true
  - type: input
    id: php-version
    attributes:
      label: PHP Version
      description: What version of PHP are you running? You can find the version of PHP your webserver is running in the `Admin Settings` section in the footer, and the cli version by running `php -v` via command line .
      placeholder: ex. v8.3.1 (web), PHP 8.4.12 (cli)
    validations:
      required: true
  - type: input
    id: composer-version
    attributes:
      label: Composer Version
      description: What version of composer are you running? You can find the version number by running `composer --version`.
      placeholder: ex. 2.8.10
    validations:
      required: true
  - type: input
    id: db-version
    attributes:
      label: MySQL/MariaDB version
      description: What database are you using, and what version?
      placeholder: ex. MySQL 5.7
    validations:
      required: true
  - type: dropdown
    id: install-method
    attributes:
      label: Deployment Method
      options:
        - Git install
        - Manual install
        - Docker
        - Managed hosting
        - Other
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: upgrade-or-fresh
    attributes:
      label: Is this a fresh install or an upgrade?
      options:
        - Fresh install
        - Upgrade
        - NA
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us, what did you expect to happen?
      placeholder: Tell us what you see! (Be nice!)
    validations:
      required: true
  - type: dropdown
    id: browsers
    attributes:
      label: What browsers are you seeing the problem on?
      multiple: true
      options:
        - Firefox
        - Chrome
        - Safari
        - Microsoft Edge
        - Other
  - type: dropdown
    id: on-demo
    attributes:
      label: Can you reproduce this elsewhere?
      description: For example on staging, local development, or another controlled environment.
      options:
        - 'Yes'
        - 'No'
        - N/A
    validations:
      required: true
  - type: dropdown
    id: fmcs
    attributes:
      label: Do you have full multiple company support enabled?
      description: You can check this in `Admin Settings > General Settings > Scoping`.
      options:
        - 'Yes'
        - 'No'
    validations:
      required: true
  - type: dropdown
    id: fmcs-location
    attributes:
      label: If you have full multiple company support enabled, do you have location scoping to company enabled?
      description: You can check this in `Admin Settings > General Settings > Scoping`.
      options:
        - 'Yes'
        - 'No'
        - I do not have full multiple company support enabled
    validations:
      required: true
  - type: textarea
    id: server-logs
    attributes:
      label: Application log output
      description: Please copy and paste any relevant log output from `storage/logs/laravel.log`. This will be automatically formatted into code, so no need for backticks.
      render: shell
  - type: textarea
    id: browser-logs
    attributes:
      label: Browser console output
      description: Please copy and paste any relevant log output from your browser console. This will be automatically formatted into code, so no need for backticks.
      render: shell
  - type: checkboxes
    id: common-issues
    attributes:
      label: Common Issues
      description: Please make sure you have done the following before submitting your issue.
      options:
        - label: I have searched this repo for existing issues related to my issue (including closed issues)
          required: true
        - label: My APP_URL is set correctly in my .env file (including http or https and no trailing slash)
          required: true
        - label: I have run database migrations (where applicable).
          required: true
        - label: I have attached screenshots and/or videos of the issue (where applicable)
          required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow this repository's Code of Conduct.
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
