name: Feature Request
description: Request a new feature.
title: "[Feature]: "
type: feature
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this feature request.

        Please search existing issues first and add context there if the request already exists.
  - type: input
    id: version
    attributes:
      label: Application Version
      description: What version or commit are you currently running?
      placeholder: ex. v1.0.0 or 1a2b3c4
    validations:
      required: true
  - type: textarea
    id: feature-description
    attributes:
      label: How can we help?
      description: Describe the use case, expected behavior, and why it matters.
      placeholder: Tell us what you'd like to see added.
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow this repository's Code of Conduct.
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
